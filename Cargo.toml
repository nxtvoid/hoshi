[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
hoshi-core = { path = "crates/hoshi-core" }
hoshi-engine = { path = "crates/hoshi-engine" }
hoshi-providers = { path = "crates/hoshi-providers" }
hoshi-store = { path = "crates/hoshi-store" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dunce = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
tauri-plugin-dialog = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
