[workspace]
resolver = "3"
members = ["apps/native", "crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "1.3.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
hoshi-app = { path = "crates/hoshi-app" }
hoshi-core = { path = "crates/hoshi-core" }
hoshi-engine = { path = "crates/hoshi-engine" }
hoshi-forge = { path = "crates/hoshi-forge" }
hoshi-providers = { path = "crates/hoshi-providers" }
hoshi-store = { path = "crates/hoshi-store" }
hoshi-ui = { path = "crates/hoshi-ui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dunce = "1"
ignore = "0.4"
portable-pty = "0.9"
notify = "8"
ureq = "3"
tiny_http = "0.12"
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
getrandom = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rusqlite = { version = "0.41", features = ["bundled"] }
roxmltree = "0.20"
zip = { version = "9", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# gpui-base 0.9.1 with patches: textareas take text decorations (`set_decorations`), for the
# composer's inline marks; selectable text takes highlights, for diff syntax colors; markdown it
# can't parse shows as text; and long documents build only the blocks in view. See
# vendor/README.md.
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
markdown = { path = "vendor/markdown" }
