[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/*"]

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
hoshi-core = { path = "crates/hoshi-core" }
hoshi-engine = { path = "crates/hoshi-engine" }
hoshi-forge = { path = "crates/hoshi-forge" }
hoshi-providers = { path = "crates/hoshi-providers" }
hoshi-store = { path = "crates/hoshi-store" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
thiserror = "2"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dunce = "1"
ignore = "0.4"
portable-pty = "0.9"
notify = "8"
ureq = "3"
tiny_http = "0.12"
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
getrandom = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rusqlite = { version = "0.41", features = ["bundled"] }
tauri-plugin-dialog = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
