[package]
name = "hoshi-ui"
description = "Reusable native components and the theme: they know nothing about the app."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures = "0.3"
gpui-kit = "0.9.1"
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
gpui-kit = { version = "0.9.1", features = ["test-support"] }

[lints]
workspace = true
