# Checks every pull request to main, and main itself: formatting, lints and tests.
#
# A pull request's code runs here, so the job gets no secrets and a read-only token. The
# Cargo cache it restores is never read by the release workflow, which builds from scratch.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # "Check" is a required status, so it has to report on every pull request. When only docs
  # change it is skipped instead, which counts as passing.
  changes:
    name: Changes
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PULL: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -n "$PULL" ]; then
            files=$(gh api "repos/$REPO/pulls/$PULL/files" --paginate --jq '.[].filename')
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename')
          else
            files=unknown
          fi
          if [ "$(printf '%s\n' "$files" | wc -l)" -ge 300 ] ||
            printf '%s\n' "$files" | grep -qvE '\.md$|^LICENSE$|^\.github/ISSUE_TEMPLATE/'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig1-dev libfreetype6-dev libdbus-1-dev pkg-config

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and lint
        run: bun run check

      # Chrome's first start on a fresh runner builds its caches; the browser tests start
      # several at once and would wait on that.
      - name: Warm up Chrome
        run: timeout 120 google-chrome --headless=new --disable-gpu --dump-dom about:blank > /dev/null || true

      - name: Test
        run: bun run test
