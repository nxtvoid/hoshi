# Builds hoshi for Windows and Linux when a version tag is pushed, then drafts a GitHub release
# with the installers. Publishing the draft is what makes installed apps see the update.
#
# Building runs every dependency's code, so it gets no secrets and a read-only token.
# Only the release job, which runs no build, sees the signing key and may write.
#
# Run by hand on a branch (`gh workflow run release.yml --ref <branch>`), it only builds and
# checks the installers: a dry run before tagging.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            format: nsis
          - platform: ubuntu-22.04
            format: deb
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the app version
        id: version
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig1-dev libfreetype6-dev libdbus-1-dev pkg-config

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      # Builds with `--locked`, which refuses a Cargo.lock that drifted.
      - name: Build and package
        shell: bash
        env:
          FORMAT: ${{ matrix.format }}
        run: cargo packager --release -p hoshi-native -f "$FORMAT"

      # The app looks for its update under exactly this name (`InstallerFormat::asset_name`).
      - name: Collect the installer
        shell: bash
        env:
          FORMAT: ${{ matrix.format }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          case "$FORMAT" in
            nsis) name="hoshi_${VERSION}_x64-setup.exe" ;;
            deb) name="hoshi_${VERSION}_amd64.deb" ;;
          esac
          mkdir installers
          cp "target/release/$name" installers/
          ls -l installers

      - name: Check the package installs
        if: matrix.format == 'deb'
        run: |
          sudo apt-get install -y ./installers/*.deb
          test -x /usr/bin/hoshi
          test -f /usr/share/applications/dev.hoshi.app.desktop
          test -f /usr/share/metainfo/dev.hoshi.app.metainfo.xml
          ls /usr/share/icons/hicolor/*/apps/hoshi.png

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.platform }}
          path: installers/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft the release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # creates the draft release and uploads its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true

      # Only for the signer; no install scripts run, and nothing gets built.
      - name: Install the signer
        run: bun install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      # The app installs an update only when its `.sig` checks out against the key it ships.
      - name: Sign the installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          for file in "$GITHUB_WORKSPACE"/installers/*; do
            bun x tauri signer sign "$file"
          done
          ls -l installers

      - name: Write the release notes
        run: |
          bun scripts/release-notes.ts "$GITHUB_REF_NAME" > notes.md
          cat notes.md

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --repo "$GITHUB_REPOSITORY" \
            --title "hoshi $GITHUB_REF_NAME" \
            --notes-file notes.md \
            installers/*
