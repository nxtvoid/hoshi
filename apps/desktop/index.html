<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hoshi</title>
    <style>
      html {
        background: #ffffff;
        color: #737373;
      }
      html.dark {
        background: #0a0a0a;
        color: #a1a1a1;
      }
      html[data-palette="grove"] {
        --palette-hue: 158;
      }
      html[data-palette="ocean"] {
        --palette-hue: 245;
      }
      html[data-palette="ember"] {
        --palette-hue: 48;
      }
      html[data-palette="iris"] {
        --palette-hue: 294;
      }
      html[data-palette] {
        background: oklch(0.988 0.004 var(--palette-hue));
      }
      html.dark[data-palette] {
        background: oklch(0.16 0.01 var(--palette-hue));
      }
      #boot-shell {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot-shell svg {
        width: 48px;
        height: 48px;
      }
    </style>
    <script>
      ;(() => {
        const root = document.documentElement
        let saved = {}
        try {
          saved = JSON.parse(localStorage.getItem('hoshi-theme'))?.state ?? {}
        } catch (_) {}
        const mode = ['light', 'dark'].includes(saved.preference)
          ? saved.preference
          : 'system'
        const palettes = ['grove', 'ocean', 'ember', 'iris']
        const builtIn = ['hoshi', ...palettes]
        const customs = Array.isArray(saved.customThemes)
          ? saved.customThemes.filter(
              (theme) =>
                theme &&
                typeof theme.id === 'string' &&
                theme.colors &&
                typeof theme.colors === 'object'
            )
          : []
        const find = (id) =>
          typeof id !== 'string'
            ? undefined
            : builtIn.includes(id)
              ? { id, builtIn: true }
              : customs.find((theme) => theme.id === id)
        const colorsFor = (theme, appearance) =>
          theme.builtIn ||
          (theme.appearance === appearance
            ? theme.colors
            : theme.variants?.[appearance]) ||
          null
        const half = (appearance) => {
          const theme = find(saved.halves?.[appearance])
          return theme && colorsFor(theme, appearance) ? theme : undefined
        }
        const base = find(saved.theme) ?? find(saved.palette) ?? find('hoshi')
        const wanted =
          mode === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : mode
        const appearance =
          half(wanted) || colorsFor(base, wanted) ? wanted : base.appearance
        const theme = half(appearance) ?? base
        root.classList.toggle('dark', appearance === 'dark')
        const set = (key, value, fallback) => {
          if (typeof value === 'string' && value !== fallback) {
            root.dataset[key] = value
          }
        }
        if (palettes.includes(theme.id)) root.dataset.palette = theme.id
        if (!theme.builtIn) {
          const colors = colorsFor(theme, appearance) || theme.colors
          for (const [role, value] of Object.entries(colors)) {
            if (/^[a-z][a-zA-Z]*$/.test(role) && /^[^;{}]+$/.test(value)) {
              const name = role.replace(/[A-Z]/g, (c) => `-${c.toLowerCase()}`)
              root.style.setProperty(`--${name}`, value)
            }
          }
          if (typeof colors.background === 'string') {
            root.style.backgroundColor = colors.background
          }
        }
        set('font', saved.interfaceFont, 'geist')
        set('codeFont', saved.codeFont, 'jetbrains')
        if (saved.lighterText === false) root.dataset.textWeight = 'regular'
        if (saved.fontSmoothing === false) root.dataset.fontSmoothing = 'off'
        const size = (value, min, max) =>
          typeof value === 'number' && Number.isFinite(value)
            ? `${Math.min(max, Math.max(min, Math.round(value)))}px`
            : null
        const interfaceSize = size(saved.interfaceSize, 12, 20)
        if (interfaceSize && interfaceSize !== '16px') {
          root.style.fontSize = interfaceSize
        }
        const codeSize = size(saved.codeSize, 10, 18)
        if (codeSize && codeSize !== '13px') {
          root.style.setProperty('--code-font-size', codeSize)
        }
        if (saved.separateFonts === true) {
          set('composerFont', saved.composerFont, 'interface')
          set('terminalFont', saved.terminalFont)
          root.style.setProperty(
            '--composer-font-size',
            size(saved.composerSize, 12, 20) ?? '14px'
          )
          root.style.setProperty(
            '--terminal-font-size',
            size(saved.terminalSize, 8, 20) ?? '12px'
          )
        }
        const agent = navigator.userAgent
        root.dataset.platform = /Windows/.test(agent)
          ? 'windows'
          : /Mac/.test(agent)
            ? 'mac'
            : 'linux'
      })()
    </script>
  </head>

  <body>
    <div id="root">
      <div id="boot-shell">
        <svg viewBox="0 -0.5 19 19" aria-hidden="true">
          <path
            fill="currentColor"
            fill-rule="evenodd"
            shape-rendering="crispEdges"
            d="M9 0h1v1h-1zM8 1h3v1h-3zM8 2h3v1h-3zM7 3h5v1h-5zM7 4h5v1h-5zM0 5h19v1h-19zM1 6h17v1h-17zM2 7h15v1h-15zM3 8h13v1h-13zM4 9h11v1h-11zM4 10h11v1h-11zM4 11h11v1h-11zM4 12h11v1h-11zM3 13h13v1h-13zM3 14h6v1h-6zM10 14h6v1h-6zM2 15h5v1h-5zM12 15h5v1h-5zM2 16h4v1h-4zM13 16h4v1h-4zM1 17h3v1h-3zM15 17h3v1h-3zM4 7h11v1h-11zM5 8h4v1h-4zM10 8h4v1h-4zM6 11h1v1h-1zM12 11h1v1h-1zM7 12h5v1h-5z"
          />
        </svg>
      </div>
    </div>
    <script>
      try {
        window.__TAURI_INTERNALS__
          .invoke('plugin:window|show', { label: 'main' })
          .catch(() => {})
      } catch (_) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
