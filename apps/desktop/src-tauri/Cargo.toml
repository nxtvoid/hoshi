[package]
name = "hoshi-desktop"
description = "hoshi desktop shell: windows and Tauri commands, wired to the core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Distinct from the bin name, see https://github.com/rust-lang/cargo/issues/8519
name = "hoshi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog.workspace = true
hoshi-engine.workspace = true
hoshi-forge.workspace = true
hoshi-core.workspace = true
hoshi-providers.workspace = true
serde_json.workspace = true
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
arboard = { version = "3", features = ["wayland-data-control"] }
png = "0.18"

[lints]
workspace = true
