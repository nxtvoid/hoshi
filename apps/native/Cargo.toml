[package]
name = "hoshi-native"
description = "Spike: hoshi's UI drawn natively with GPUI instead of a webview."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
base64.workspace = true
chrono.workspace = true
futures = "0.3"
gpui-kit = { version = "0.9.1", features = ["syntect"] }
hoshi-app.workspace = true
hoshi-core.workspace = true
hoshi-engine.workspace = true
hoshi-ui.workspace = true
markdown = "1.0.0"
notify-rust = "4.18"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "webp"] }
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[build-dependencies]
serde_json.workspace = true
tauri-winres = "0.3"

[lints]
workspace = true

[dev-dependencies]
gpui-kit = { version = "0.9.1", features = ["test-support"] }
hoshi-providers.workspace = true
hoshi-store.workspace = true
