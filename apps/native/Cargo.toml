[package]
name = "hoshi-native"
description = "A desktop home for coding agents"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hoshi"
path = "src/main.rs"

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
base64.workspace = true
cap.workspace = true
chrono.workspace = true
futures = "0.3"
gpui-kit = { version = "0.9.1", features = ["syntect"] }
hoshi-app.workspace = true
hoshi-core.workspace = true
hoshi-engine.workspace = true
hoshi-ui.workspace = true
markdown = "1.0.0"
notify-rust = "4.18"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "webp"] }
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3"
ureq.workspace = true
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[build-dependencies]
serde_json.workspace = true
tauri-winres = "0.3"

[lints]
workspace = true

[dev-dependencies]
gpui-kit = { version = "0.9.1", features = ["test-support"] }
hoshi-providers.workspace = true
hoshi-store.workspace = true

# `cargo packager --release -p hoshi-native -f nsis` (Windows) or `-f deb` (Linux).
[package.metadata.packager]
product-name = "hoshi"
identifier = "dev.hoshi.app"
category = "DeveloperTool"
before-packaging-command = "cargo build --release --locked -p hoshi-native"
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.png", "icons/icon.ico"]

[package.metadata.packager.nsis]
installer-icon = "icons/icon.ico"

[package.metadata.packager.linux]
generate-desktop-entry = false

[package.metadata.packager.deb]
depends = ["libdbus-1-3", "libfontconfig1", "libfreetype6", "libvulkan1", "libxkbcommon0", "libxkbcommon-x11-0"]

[package.metadata.packager.deb.files]
"linux/dev.hoshi.app.desktop" = "/usr/share/applications/dev.hoshi.app.desktop"
"linux/dev.hoshi.app.metainfo.xml" = "/usr/share/metainfo/dev.hoshi.app.metainfo.xml"
